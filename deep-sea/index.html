<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deep Sea Aquarium</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#062038">
<meta name="mobile-web-app-capable" content="yes">
<style>
  /* Fredoka (rounded, bubbly) for titles, names, numbers and buttons; Nunito for reading text. Both SIL OFL, see fonts/. */
  @font-face{font-family:"Fredoka";src:url(fonts/fredoka.woff2) format("woff2");font-weight:300 700;font-display:swap}
  @font-face{font-family:"Nunito";src:url(fonts/nunito.woff2) format("woff2");font-weight:200 1000;font-display:swap}
  :root{--display:"Fredoka","Nunito","Segoe UI",sans-serif;--body:"Nunito","Segoe UI",sans-serif;
    --ink:#f2fbff;--ink-soft:#bcd9ec;--ink-faint:#8fb3cc;--aqua:#7fe0f5;--gold:#ffd67a}
  html,body{margin:0;height:100%;overflow:hidden;background:#021018;color:var(--ink);
    font-family:var(--body);user-select:none;-webkit-font-smoothing:antialiased}
  canvas#c{display:block;width:100vw;height:100vh;touch-action:none}
  .hidden{display:none!important}
  .ui{transition:opacity .8s}
  body.idle .ui{opacity:0;pointer-events:none}
  body.idle{cursor:none}
  .glass{background:rgba(3,16,32,.84);backdrop-filter:blur(8px);border:1px solid rgba(160,220,255,.2);border-radius:20px}
  .hud{position:fixed;top:18px;left:20px;padding:10px 18px;border-radius:18px;
    background:rgba(4,20,38,.45);backdrop-filter:blur(6px);border:1px solid rgba(160,220,255,.18)}
  .pearl{display:flex;align-items:center;gap:10px;font-size:30px;font-weight:700}
  .gem{width:24px;height:24px;border-radius:50%;flex:none;
    background:radial-gradient(circle at 35% 30%,#fff 0 18%,#e8f4ff 30%,#b9d3ef 70%,#8aa9cc);box-shadow:0 0 12px rgba(200,230,255,.6)}
  .rate{font-size:15px;opacity:.8;margin-top:2px}
  .btns{position:fixed;top:18px;right:20px;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
  button{font:inherit;font-size:17px;color:#eaf6ff;background:rgba(10,50,85,.7);border:1px solid rgba(160,220,255,.3);
    padding:10px 18px;border-radius:14px;cursor:pointer}
  button:hover:not(:disabled){background:rgba(30,90,140,.85)}
  button:disabled{opacity:.45;cursor:default}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tabs button{flex:1;padding:8px 6px;font-size:15px;background:rgba(10,50,85,.35)}
  .tabs button.on{background:rgba(40,110,170,.9)}
  .shop{position:fixed;top:78px;right:20px;width:min(390px,calc(100vw - 40px));max-height:calc(100vh - 110px);overflow-y:auto;padding:14px}
  .row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px}
  .row+.row{margin-top:4px}
  .row:hover{background:rgba(120,190,255,.07)}
  .pv{width:72px;height:52px;border-radius:10px;background:radial-gradient(circle,#154a70,#06203a);flex:none}
  .info{flex:1;min-width:0}
  .info b{display:block;font-size:17px}
  .info small{opacity:.7;font-size:13px}
  .locked .info{opacity:.6}
  .buy{padding:8px 12px;font-size:15px;white-space:nowrap}
  .acts{display:flex;gap:8px;align-items:center}
  body.book-open .card,body.panel-open .toast{display:none}
  .book{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(880px,calc(100vw - 32px));
    max-height:calc(100vh - 40px);overflow-y:auto;padding:18px;box-sizing:border-box}
  .book header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .book h2{margin:0;font-size:24px}
  .book header span{opacity:.7;flex:1}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px}
  .tile{background:rgba(120,190,255,.06);border-radius:14px;padding:8px;text-align:center;cursor:pointer;border:1px solid transparent;font-size:15px}
  .tile canvas{width:100%;aspect-ratio:120/86;border-radius:10px;background:radial-gradient(circle,#154a70,#06203a);display:block;margin-bottom:6px}
  .tile.sel{border-color:rgba(160,220,255,.7)}
  .tile.unk{opacity:.6}
  .detail{display:flex;gap:18px;align-items:center;padding:14px;margin-bottom:14px;background:rgba(120,190,255,.08);border-radius:16px;flex-wrap:wrap}
  .detail canvas{width:240px;height:150px;border-radius:12px;background:radial-gradient(circle,#154a70,#06203a);flex:none}
  .detail div{flex:1;min-width:220px}
  .detail h3{margin:0;font-size:26px}
  .detail .zone{opacity:.65;font-size:14px;margin:2px 0 8px}
  .detail p{margin:0 0 10px;font-size:18px;line-height:1.55}
  .card{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);width:min(540px,calc(100vw - 40px));
    padding:16px 22px;opacity:0;pointer-events:none;transition:opacity .4s,transform .4s;box-sizing:border-box}
  .card.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  #cAct:not(:empty){margin-top:12px;display:flex;gap:8px}
  .rel{padding:8px 10px;font-size:14px;background:rgba(90,30,40,.55)}
  .card h3{margin:0;font-size:24px}
  .card .zone{font-size:14px;opacity:.65;margin:2px 0 8px}
  .card p{margin:0;font-size:18px;line-height:1.55}
  .toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-10px);padding:10px 20px;border-radius:14px;
    background:rgba(3,16,32,.8);border:1px solid rgba(160,220,255,.25);font-size:17px;opacity:0;transition:opacity .5s,transform .5s;pointer-events:none;
    max-width:calc(100vw - 40px);text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .hint{position:fixed;left:20px;bottom:18px;font-size:14px;opacity:.55}
  .minimap{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);width:min(240px,50vw);height:10px;
    border-radius:6px;background:rgba(160,220,255,.15);overflow:hidden}
  #miniView{position:absolute;top:0;bottom:0;border-radius:6px;background:rgba(200,235,255,.6)}
  .viewtap{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:18px 28px;border-radius:18px;font-size:22px;
    background:rgba(3,16,32,.85);border:1px solid rgba(160,220,255,.3);pointer-events:none}
  .parent{position:fixed;right:16px;bottom:14px}
  .gear{width:34px;height:34px;padding:0;font-size:18px;opacity:.3;border-radius:50%;background:rgba(10,50,85,.4);
    position:relative;overflow:hidden;touch-action:none}
  .gear.holding{opacity:.9}
  .gear.holding::after{content:'';position:absolute;inset:0;background:rgba(160,220,255,.55);transform-origin:bottom;
    animation:fillup 2s linear forwards}
  @keyframes fillup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .pmenu{position:absolute;right:0;bottom:44px;padding:12px;display:flex;flex-direction:column;gap:8px;width:200px}
  .pmenu small{opacity:.65}
  body.view .parent,body.view .hud,body.view .btns,body.view .shop,body.view .book,body.view .hint,body.view .minimap{display:none!important}
  /* ---- type roles: title / label / body ---- */
  button,.pearl,.info b,.card h3,.detail h3,.book h2,.tile,.toast,.viewtap,.pmenu small,.badge{font-family:var(--display)}
  button{font-weight:500;letter-spacing:.01em}
  .pearl{font-weight:600;letter-spacing:.01em}
  .rate{font-family:var(--body);font-weight:600;color:var(--ink-soft);opacity:1}
  .info b{font-weight:600;letter-spacing:.01em}
  .info small{font-weight:600;color:var(--ink-faint);opacity:1}
  .card h3,.detail h3{font-weight:600;color:#fff;letter-spacing:.01em}
  .book h2{font-weight:600}
  .card .zone,.detail .zone,.book header span{font-family:var(--body);font-weight:800;font-size:12px;text-transform:uppercase;
    letter-spacing:.08em;color:var(--aqua);opacity:1}
  .card p,.detail p{font-family:var(--body);font-weight:500;color:var(--ink-soft)}
  .toast{font-weight:500}
  .hint{font-family:var(--body);font-weight:600}
  .tile{font-weight:500}
  .buy{font-weight:600}

  /* ---- collection stickers ---- */
  .tile{position:relative;transition:transform .2s}
  .tile:hover{transform:translateY(-2px) rotate(-1deg)}
  .tile canvas{background:radial-gradient(circle at 50% 40%,#1b5a86,#062038)}
  .badge{position:absolute;top:12px;left:12px;font-size:10px;font-weight:600;letter-spacing:.1em;padding:3px 7px;border-radius:999px;
    color:#10263a;pointer-events:none}
  .badge.rare{background:linear-gradient(135deg,#f4f8ff,#b9c8d8 45%,#ffffff 55%,#9fb2c6)}
  .badge.legendary{background:linear-gradient(90deg,#ff9ac8,#ffd67a,#9dffb8,#8fd8ff,#c9a0ff);background-size:200% 100%;animation:holo 3s linear infinite}
  .tile .prog{display:block;font-family:var(--body);font-weight:700;font-size:12px;color:var(--aqua);margin-top:2px}
  .tile.unk .prog{opacity:1}
  .detail .badge{position:static;display:inline-block;margin-bottom:6px;min-width:0;flex:none}
  @keyframes holo{to{background-position:200% 0}}

  /* Phones: shop becomes a bottom sheet, rows get compact, and nothing stacks on top of the shop. */
  @media (max-width:560px){
    .hud{top:10px;left:10px;padding:6px 12px;border-radius:14px}
    .pearl{font-size:22px;gap:8px}
    .gem{width:18px;height:18px}
    .rate{font-size:12px}
    .btns{top:10px;right:10px;gap:6px}
    .btns button{font-size:14px;padding:8px 12px}
    .hint{display:none}
    .toast{top:66px;font-size:14px;padding:8px 14px}

    .shop{top:auto;bottom:0;left:0;right:0;width:auto;max-height:58vh;border-radius:20px 20px 0 0;padding:10px 10px 16px}
    .tabs button{font-size:13px;padding:7px 4px}
    .row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:8px;padding:6px 4px}
    .pv{width:52px;height:38px;border-radius:8px}
    .info b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .info small{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .acts{flex-direction:column;align-items:stretch;gap:4px}
    .buy,.rel{padding:6px 10px;font-size:13px}
    .card{padding:12px 16px;bottom:14px}
    .card h3{font-size:19px}
    .card .zone{font-size:12px;margin-bottom:6px}
    .card p{font-size:15px;line-height:1.5}
    body.panel-open .card{top:70px;bottom:auto;max-height:calc(42vh - 80px);overflow-y:auto}
    body.panel-open .minimap,body.panel-open .parent{display:none}
    .book{padding:12px}
    .book h2{font-size:20px}
    .book header{flex-wrap:wrap;gap:4px 10px}
    .book header span{order:3;flex:0 0 100%;font-size:13px}
    .book header button{margin-left:auto;padding:6px 14px;font-size:14px}
    .detail canvas{width:160px;height:100px}
    .detail h3{font-size:21px}
    .detail p{font-size:15px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="ui hud">
  <div class="pearl"><span class="gem"></span><span id="pearls">0</span></div>
  <div class="rate" id="rate">+0 / sec</div>
</div>
<div class="ui btns">
  <button id="shopBtn">Shop</button>
  <button id="bookBtn">Collection</button>
</div>
<aside id="shop" class="ui glass shop hidden">
  <div class="tabs" id="shopTabs">
    <button data-tab="real" class="on">Sea Life</button>
    <button data-tab="legend">Legends</button>
    <button data-tab="decor">Decor</button>
  </div>
  <div id="list"></div>
</aside>
<section id="book" class="ui glass book hidden">
  <header><h2>Collection Book</h2><span id="bookCount"></span><button id="bookClose">Close</button></header>
  <div class="tabs" id="bookTabs">
    <button data-tab="real" class="on">Real Animals</button>
    <button data-tab="legend">Legendary</button>
    <button data-tab="ach">Stickers</button>
  </div>
  <div id="bookDetail" class="detail hidden"></div>
  <div id="bookGrid" class="grid"></div>
</section>
<div class="ui hint">Tap the water to feed · Tap an animal to learn about it · Drag to look around</div>
<div class="ui parent">
  <div id="parentMenu" class="glass pmenu hidden">
    <small>Parent menu</small>
    <button id="fsBtn">Fullscreen</button>
    <button id="dualBtn" class="hidden">Two screens</button>
    <button id="exitBtn">Exit fullscreen</button>
  </div>
  <button id="gear" class="gear" aria-label="Parent menu (hold for 2 seconds)">⚙</button>
</div>
<div class="ui minimap" id="minimap"><div id="miniView"></div></div>
<div id="viewTap" class="viewtap hidden">Tap this screen once to go fullscreen</div>
<div id="card" class="glass card"><h3 id="cName"></h3><div class="zone" id="cZone"></div><p id="cFact"></p><div id="cAct"></div></div>
<div id="toast" class="toast"></div>

<script>
"use strict";
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const SEABED = 0.9;

/* ================= drawing helpers (unit space) ================= */
function ell(c, x, y, rx, ry, col, rot = 0) { c.fillStyle = col; c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, TAU); c.fill(); }
function eye(c, x, y, r) {
  ell(c, x, y, r, r, '#fff');
  ell(c, x + r * .2, y + r * .05, r * .62, r * .62, '#14161f');
  ell(c, x + r * .38, y - r * .25, r * .24, r * .24, '#fff');
}
function smile(c, x, y, r, col = '#5a2a10') {
  c.strokeStyle = col; c.lineWidth = .05; c.lineCap = 'round';
  c.beginPath(); c.arc(x, y, r, .15 * Math.PI, .8 * Math.PI); c.stroke();
}
function blush(c, x, y, r) { ell(c, x, y, r, r * .6, 'rgba(255,120,140,.45)'); }
function tail(c, col, t, x0, sz = 1) {
  const w = Math.sin(t * 10) * .12 * sz;
  c.fillStyle = col; c.beginPath(); c.moveTo(x0 + .15, 0);
  c.quadraticCurveTo(x0 - .25 * sz, -.15, x0 - .55 * sz, -.5 * sz + w);
  c.quadraticCurveTo(x0 - .38 * sz, w * .5, x0 - .55 * sz, .5 * sz + w);
  c.quadraticCurveTo(x0 - .25 * sz, .15, x0 + .15, 0); c.fill();
}
function limb(c, x, y, rx, ry, a, col) {
  c.save(); c.translate(x, y); c.rotate(a); ell(c, rx * .8, 0, rx, ry, col); c.restore();
}
function glow(c, x, y, r, inner, outer) {
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, inner); g.addColorStop(.3, outer); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
}

/* ================= real animals ================= */
function dClown(c, t) {
  tail(c, '#ff7a1a', t, -.8);
  c.fillStyle = '#ff9a45'; c.beginPath(); c.moveTo(-.45, -.45); c.quadraticCurveTo(-.1, -.95, .35, -.5); c.fill();
  c.save(); c.beginPath(); c.ellipse(0, 0, 1, .58, 0, 0, TAU); c.fillStyle = '#ff7a1a'; c.fill(); c.clip();
  c.fillStyle = '#fff'; c.fillRect(.28, -1, .24, 2); c.fillRect(-.42, -1, .26, 2);
  c.fillStyle = '#1b1b1b'; c.fillRect(.25, -1, .03, 2); c.fillRect(.52, -1, .03, 2); c.fillRect(-.45, -1, .03, 2); c.fillRect(-.16, -1, .03, 2);
  c.restore();
  limb(c, .05, .18, .22, .1, .6 + Math.sin(t * 9) * .4, '#ff9a45');
  eye(c, .64, -.12, .17); blush(c, .6, .2, .1); smile(c, .8, .06, .1);
}
function dAngel(c, t) {
  const Y = '#ffd23f', B = '#2f6fd0', s = Math.sin(t * 3) * .05;
  c.fillStyle = Y;
  c.beginPath(); c.moveTo(-.5, -.45); c.quadraticCurveTo(-.7, -1.35, -1.05, -1.1 + s); c.quadraticCurveTo(-.2, -.9, .35, -.55); c.fill();
  c.beginPath(); c.moveTo(-.5, .45); c.quadraticCurveTo(-.7, 1.35, -1.05, 1.1 - s); c.quadraticCurveTo(-.2, .9, .35, .55); c.fill();
  tail(c, Y, t, -.75, .9);
  c.save(); c.beginPath(); c.ellipse(0, 0, .9, .72, 0, 0, TAU); c.fillStyle = Y; c.fill(); c.clip();
  c.fillStyle = B; c.fillRect(.08, -1, .14, 2); c.fillRect(-.4, -1, .14, 2); c.restore();
  eye(c, .5, -.18, .16); smile(c, .7, .05, .09);
}
function dPuffer(c, t, o) {
  const p = o ? o.puff : 0, r = .7 + .32 * p;
  tail(c, '#d9b56a', t, -r + .05, .7);
  if (p > .05) {
    c.strokeStyle = '#8a6a2a'; c.lineWidth = .05;
    for (let i = 0; i < 18; i++) {
      const a = i / 18 * TAU;
      c.beginPath(); c.moveTo(Math.cos(a) * r * .95, Math.sin(a) * r * .95);
      c.lineTo(Math.cos(a) * (r + .22 * p), Math.sin(a) * (r + .22 * p)); c.stroke();
    }
  }
  ell(c, 0, 0, r, r, '#e8cf85');
  ell(c, .05, r * .35, r * .8, r * .5, '#fff6da');
  for (const [x, y] of [[-.3, -.35], [0, -.55], [-.55, -.05], [.25, -.3], [-.15, -.1]]) ell(c, x * r, y * r, r * .07, r * .07, '#9c7a3a');
  limb(c, -.05, .1, .22, .1, Math.sin(t * 12) * .5 + .4, '#d9b56a');
  eye(c, r * .45, -r * .3, .18 + .04 * p); blush(c, r * .5, r * .12, .09);
  ell(c, r * .92, r * .12, .06, .05 + .04 * p, '#7a4a2a');
}
function dTurtle(c, t) {
  const fl = Math.sin(t * 3) * .5;
  limb(c, .3, -.3, .5, .14, -.9 - fl, '#4d8f58'); limb(c, -.6, -.2, .3, .12, -2.6, '#4d8f58');
  ell(c, 1.05, -.02, .32, .25, '#7cc47f');
  limb(c, .3, .3, .55, .16, .8 + fl, '#6cb877'); limb(c, -.6, .25, .32, .12, 2.5 + fl * .3, '#6cb877');
  ell(c, 0, 0, .95, .6, '#6b4f2a'); ell(c, 0, -.03, .82, .5, '#8f6d3c');
  for (const [x, y] of [[-.4, -.1], [0, -.17], [.4, -.1], [-.2, .2], [.2, .2]]) ell(c, x, y, .16, .13, '#a98450');
  eye(c, 1.15, -.1, .09); smile(c, 1.2, 0, .07, '#2d5a33');
}
function dSword(c, t) {
  const w = Math.sin(t * 10) * .08;
  c.fillStyle = '#c8d3e0'; c.beginPath(); c.moveTo(.85, -.06); c.lineTo(1.95, 0); c.lineTo(.85, .06); c.fill();
  c.fillStyle = '#2a4d7a';
  c.beginPath(); c.moveTo(-1, 0); c.quadraticCurveTo(-1.2, -.3, -1.5, -.65 + w); c.quadraticCurveTo(-1.25, 0, -1.5, .65 + w); c.quadraticCurveTo(-1.2, .3, -1, 0); c.fill();
  c.beginPath(); c.moveTo(-.1, -.25); c.quadraticCurveTo(0, -.8, -.35, -.8); c.quadraticCurveTo(-.3, -.5, -.5, -.25); c.fill();
  const g = c.createLinearGradient(0, -.3, 0, .3); g.addColorStop(0, '#2d5d95'); g.addColorStop(1, '#dfe8f2');
  c.fillStyle = g; c.beginPath(); c.moveTo(.95, 0); c.bezierCurveTo(.7, -.35, -.6, -.35, -1.05, 0); c.bezierCurveTo(-.6, .32, .7, .32, .95, 0); c.fill();
  limb(c, .3, .12, .35, .07, .6 + Math.sin(t * 6) * .2, '#3a6aa0');
  eye(c, .62, -.07, .1);
}
function dJelly(c, t) {
  const p = Math.sin(t * 3);
  c.lineCap = 'round';
  c.strokeStyle = 'rgba(255,180,230,.55)'; c.lineWidth = .05;
  for (let i = 0; i < 5; i++) {
    const x0 = -.5 + i * .25; c.beginPath(); c.moveTo(x0, .2);
    for (let k = 1; k <= 8; k++) c.lineTo(x0 + Math.sin(t * 2 + k * .7 + i) * .12, .2 + k * .2);
    c.stroke();
  }
  c.strokeStyle = 'rgba(255,150,215,.7)'; c.lineWidth = .12;
  for (const x0 of [-.12, .12]) {
    c.beginPath(); c.moveTo(x0, .2);
    for (let k = 1; k <= 5; k++) c.lineTo(x0 + Math.sin(t * 2.4 + k + x0 * 9) * .1, .2 + k * .2);
    c.stroke();
  }
  c.save(); c.scale(1 + p * .08, 1 - p * .08);
  const g = c.createRadialGradient(0, -.3, .1, 0, -.2, .9);
  g.addColorStop(0, 'rgba(255,215,245,.92)'); g.addColorStop(1, 'rgba(240,120,210,.6)');
  c.fillStyle = g; c.beginPath(); c.moveTo(-.8, .25); c.bezierCurveTo(-.85, -.85, .85, -.85, .8, .25);

/* ================= state ================= */
// A window opened as "#view" is the second screen: it only draws what the main window sends it.
const IS_VIEW = location.hash === '#view';
const KEY = 'deepsea-aquarium-v1';
let state = { pearls: 15, owned: { clown: 2 }, decor: {}, lastSeen: Date.now() };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.owned) state = s; } catch (e) {}
state.decor = state.decor || {};
// Pearl vault cap: well above the most expensive item (20 billion) so nothing ever becomes unreachable,
// but low enough that numbers stay exact and readable no matter how long the tank runs.
const CAP = 1e11;
function addPearls(n) {
  if (!Number.isFinite(n) || n <= 0) return;
  state.pearls = Math.min(CAP, state.pearls + n);
  if (state.stats && state.stats.earned < 1e15) state.stats.earned += n;
}
state.pearls = Number.isFinite(state.pearls) ? Math.max(0, Math.min(CAP, state.pearls)) : 0;
for (const sp of SP) {
  const n = Math.floor(Number(state.owned[sp.id]) || 0);
  state.owned[sp.id] = Math.max(0, Math.min(sp.max, n));
}
function save() { if (IS_VIEW) return; try { state.lastSeen = Date.now(); localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
const has = sp => (state.owned[sp.id] || 0) > 0;
const mult = () => 1 + DECOR.reduce((a, d) => a + (state.decor[d.id] ? d.bonus : 0), 0);
const income = () => SP.reduce((a, s) => a + (state.owned[s.id] || 0) * s.inc, 0) * mult();
const price = sp => Math.ceil(sp.cost * Math.pow(1.15, state.owned[sp.id] || 0));
const unlocked = sp => { const i = SP.indexOf(sp); return i === 0 || has(sp) || has(SP[i - 1]); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function fmt(n) {
  if (n < 10 && n % 1) return n.toFixed(1);
  if (n < 1e6) return Math.floor(n).toLocaleString('en-US');
  const m = n / 1e6;
  if (m < 1000) return (Math.floor(m * 10) / 10) + 'M';
  return (Math.floor(m / 100) / 10).toLocaleString('en-US') + 'B';
}

function mulberry32(a) {

function render(t, viewX, showLabels) {

/* ================= main loop (main window: runs the whole tank) ================= */
let last = performance.now(), T = 0, hudT = 0;
function frame(now) {
  const rdt = Math.max(0, (now - last) / 1000); last = now;
  const dt = Math.min(rdt, .05); T += dt;
  addPearls(income() * rdt); sessionT += rdt;

  for (const o of creatures) updCreature(o, dt);
  creatures = creatures.filter(o => !o.gone);
  updPass(dt); updChest(dt); updCamera(dt);
  for (const p of pellets) { p.y += u * 3 * dt; p.x += Math.sin(T * 2 + p.ph) * u * .3 * dt; }
  pellets = pellets.filter(p => p.y < H * .62);
  for (const s of sparks) { s.life -= dt; s.vy += u * 6 * dt; s.x += s.vx * dt; s.y += s.vy * dt; }
  sparks = sparks.filter(s => s.life > 0);
  for (const x of texts) { x.life -= dt; x.y -= u * 3 * dt; }
  texts = texts.filter(x => x.life > 0);
  updCosmetics(dt, T);

  render(T, camX + slot * W, slot === span - 1);
  sendSnapshot();

  hudT -= rdt;
  if (hudT <= 0) { hudT = .25; updateHud(); countDay(); checkAch(false); }
  requestAnimationFrame(frame);
}

/* ----- collection stickers -----
   Every found animal becomes a die-cut sticker (white border + shadow). Rare ones sparkle with glitter;
   legendary ones get a moving rainbow holo sheen, a glare band and glitter. The sheen follows the finger
   or mouse over the sticker, and drifts on its own otherwise. */
const RARITY = ['', 'rare', 'legendary'];

const stickerCache = new Map();

  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const g = c.getContext('2d'); g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
  return c;
}
function makeSticker(sp, w, h) {

  const art = document.createElement('canvas'); art.width = w; art.height = h;
  drawFit(art, c => sp.draw(c, 1.3, { puff: 0, open: 0 }), sp.box, false, sp.stickerFill || .8);
  const r = Math.max(3, h * .045), white = tinted(art, '#fff');

  const m = mask.getContext('2d');

  m.drawImage(white, 0, 0);

}

  L.globalCompositeOperation = 'source-over'; L.clearRect(0, 0, w, h);
  if (fx.tier === 2) {
    const g = L.createLinearGradient(w * (k - 1), 0, w * (k + .6), h);
    ['#ff6fa8', '#ffc86b', '#fff67a', '#7dffb2', '#6fd8ff', '#9d8cff', '#ff7ad9', '#ff6fa8', '#ffc86b', '#7dffb2']
      .forEach((col, i, a) => g.addColorStop(i / (a.length - 1), col));

  gg.addColorStop(0, 'rgba(255,255,255,0)'); gg.addColorStop(.5, 'rgba(255,255,255,.95)'); gg.addColorStop(1, 'rgba(255,255,255,0)');

    c.fillStyle = '#fff6cf'; c.strokeStyle = '#9a5a00'; c.lineWidth = .04;
    c.beginPath(); c.moveTo(-.4, .22); c.lineTo(-.44, -.2); c.lineTo(-.2, .02); c.lineTo(0, -.32); c.lineTo(.2, .02); c.lineTo(.44, -.2); c.lineTo(.4, .22); c.closePath(); c.fill(); c.stroke();
    for (const [x, col] of [[-.2, '#ff5d7a'], [0, '#5dd6ff'], [.2, '#7dff9a']]) ell(c, x, .1, .05, .05, col);
  },
  star: c => { c.fillStyle = '#fff'; c.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? .17 : .42; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); } c.fill(); },
  chest: c => { c.translate(0, .22); c.scale(.55, .55); ddChest(c, 0, { open: .6 }); },
  castle: c => { c.translate(0, .42); c.scale(.3, .3); ddCastle(c, 1); },
};
function A(id, name, tier, icon, desc, goal) { return { id: 'a_' + id, name, tier, desc, goal, draw: achArt(tier, icon), box: [-1.02, -1.02, 1.02, 1.02], stickerFill: 1.08 }; }
const ACH = [
  A('snack', 'Snack Time', 0, (c, t) => { ic.sp('clown', .6, .08, -.1)(c); }, 'Feed the fish 500 times.', () => [S.feeds, 500]),
  A('curious', 'Curious Explorer', 0, ic.glass, 'Tap 10 different kinds of animals to learn about them.', () => [S.tapped.length, 10]),
  A('puff', 'Puff Puff', 0, ic.sp('puffer', .9), 'Make a pufferfish puff up 100 times.', () => [S.puffs, 100]),
  A('school', 'Full School', 0, ic.sp('clown', .95), 'Have 12 clownfish in the tank at once.', () => [own('clown'), 12]),
  A('shadow', 'Mystery Shadow', 0, ic.q, 'Spot 5 mystery shadows in the deep.', () => [S.teases, 5]),
  A('kind', 'Kind Keeper', 0, ic.heart, 'Release 10 animals back to the sea.', () => [S.releases, 10]),
  A('pearls', 'Pearl Collector', 0, ic.pearl, 'Collect 10 million pearls in total.', () => [S.earned, 1e7]),
  A('chef', 'Master Chef', 1, ic.sp('whaleshark', .95), 'Feed the fish 5,000 times.', () => [S.feeds, 5000]),
  A('biologist', 'Marine Biologist', 1, ic.sp('squid', 1), 'Learn about every real sea animal.', () => [REAL.filter(s => S.tapped.includes(s.id)).length, REAL.length]),
  A('deep', 'Into the Deep', 1, ic.sp('angler', .95), 'Fill the midnight zone: every anglerfish, vampire squid, gulper eel and dumbo octopus.',
    () => [['angler', 'vampire', 'gulper', 'dumbo'].reduce((a, id) => a + own(id), 0), ['angler', 'vampire', 'gulper', 'dumbo'].reduce((a, id) => a + BY[id].max, 0)]),
  A('spotter', 'Bloop Spotter', 1, ic.sp('bloop', 1), 'See The Bloop swim by 25 times.', () => [S.seen.bloop || 0, 25]),
  A('treasure', 'Treasure Hunter', 1, ic.chest, 'Watch the treasure chest open 100 times.', () => [S.chests, 100]),
  A('designer', 'Interior Designer', 1, ic.castle, 'Own every decoration.', () => [DECOR.filter(d => state.decor[d.id]).length, DECOR.length]),
  A('night', 'Night Watch', 1, ic.moon, 'Keep the tank open for 8 hours in one go.', () => [Math.floor(sessionT / 60), 480]),
  A('tycoon', 'Pearl Tycoon', 1, ic.pearl, 'Collect 10 billion pearls in total.', () => [S.earned, 1e10]),
  A('emperor', 'Pearl Emperor', 2, ic.crown, 'Collect 1 trillion pearls in total.', () => [S.earned, 1e12]),
  A('legends', 'Legend Keeper', 2, ic.sp('naga', 1), 'Find every legendary creature.', () => [LEGENDS.filter(has).length, LEGENDS.length]),
  A('complete', 'Complete Collection', 2, ic.star, 'Find all 20 animals and fill the tank with every real animal it can hold.',
    () => [SP.filter(has).length + REAL.reduce((a, s) => a + own(s.id), 0), SP.length + REAL.reduce((a, s) => a + s.max, 0)]),
  A('quake', 'Earthquake!', 2, ic.sp('anon', 1), 'Feel Pla Anon move 10 times.', () => [S.seen.anon || 0, 10]),
  A('superfan', 'Bloop Superfan', 2, ic.sp('bloop', 1), 'See The Bloop swim by 100 times.', () => [S.seen.bloop || 0, 100]),
  A('devoted', 'Devoted Keeper', 2, ic.sp('turtle', .95), 'Visit the tank on 30 different days.', () => [S.days, 30]),
];
const achDone = a => { const [cur, max] = a.goal(); return cur >= max; };
function checkAch(silent) {
  const fresh = [];
  for (const a of ACH) if (!state.ach[a.id] && achDone(a)) { state.ach[a.id] = Date.now(); fresh.push(a); }
  if (!fresh.length) return;
  save();
  if (silent) { setTimeout(() => toast(`You earned ${fresh.length} new sticker${fresh.length > 1 ? 's' : ''}! Look in the Collection.`), 6000); return; }
  const a = fresh[fresh.length - 1];
  showInfo('New sticker: ' + a.name, RARITY[a.tier] ? RARITY[a.tier] + ' sticker' : 'Sticker', a.desc);
  const cx = camX + slot * W + W / 2, cy = H * .4;
  for (let i = 0; i < 60; i++) sparks.push({ x: cx + rand(-3, 3) * u, y: cy, vx: rand(-14, 14) * u, vy: rand(-26, -6) * u, life: rand(1.6, 3) });
  if (fresh.length > 1) toast(`You earned ${fresh.length} new stickers!`);
}
function countDay() {
  const d = new Date(), day = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
  if (S.lastDay !== day) { S.lastDay = day; S.days++; }
}
const achProgress = a => { const [cur, max] = a.goal(); return `${fmt(Math.min(cur, max))} / ${fmt(max)}`; };

/* ----- collection book ----- */
let bookTab = 'real', bookSel = null;
function renderBook() {
  bookFx = [];
  if (!bookRAF) bookRAF = requestAnimationFrame(bookLoop);
  if (bookTab === 'ach') { renderStickers(); return; }
  const all = SP.length, found = SP.filter(has).length;
  $('bookCount').textContent = `Found ${found} of ${all}`;
  const grid = $('bookGrid'); grid.innerHTML = '';
  for (const sp of SP.filter(s => bookTab === 'legend' ? s.legend : !s.legend)) {
    const known = has(sp);
    const tile = document.createElement('div'); tile.className = 'tile' + (known ? '' : ' unk') + (bookSel === sp ? ' sel' : '');
    tile.append(known ? stickerEl(sp, 240, 172, tile) : preview(sp, 240, 172, true));
    const bd = known && badge(sp); if (bd) tile.append(bd);
    const label = document.createElement('div'); label.textContent = known ? sp.name : '???'; tile.append(label);
    tile.onclick = () => { bookSel = sp; renderBook(); };
    grid.append(tile);
  }
  const det = $('bookDetail');
  if (!bookSel) { det.classList.add('hidden'); return; }
  det.classList.remove('hidden'); det.innerHTML = '';
  const known = has(bookSel);
  det.append(known ? stickerEl(bookSel, 480, 300) : preview(bookSel, 480, 300, true));
  const box = document.createElement('div');
  if (known) {
    const bd = badge(bookSel);
    box.innerHTML = `${bd ? bd.outerHTML : ''}<h3>${bookSel.name}</h3><div class="zone">${bookSel.legend || bookSel.pass ? bookSel.origin : zoneName(bookSel)}</div><p>${bookSel.fact}</p>`;
    if (bookSel.pass) {
      const b = document.createElement('button'); b.textContent = 'Call it to swim by';
      b.onclick = () => {
        if (pass) { toast('Wait for the one swimming now to pass by'); return; }
        startPass(bookSel, false, true); passTimer = rand(150, 240); $('book').classList.add('hidden'); wake();
      };
      box.append(b);
    }
  } else {
    box.innerHTML = unlocked(bookSel)
      ? `<h3>???</h3><div class="zone">Not found yet</div><p>Collect ${fmt(price(bookSel))} pearls, then buy it in the Shop.</p>`
      : `<h3>???</h3><div class="zone">Not found yet</div><p>Buy the ${SP[SP.indexOf(bookSel) - 1].name} first to find out what this is.</p>`;
  }
  det.append(box);
}
function renderStickers() {
  const got = ACH.filter(a => state.ach[a.id]).length;
  $('bookCount').textContent = `Stickers ${got} of ${ACH.length}`;
  const grid = $('bookGrid'); grid.innerHTML = '';
  for (const a of ACH) {
    const done = !!state.ach[a.id];
    const tile = document.createElement('div'); tile.className = 'tile' + (done ? '' : ' unk') + (bookSel === a ? ' sel' : '');
    tile.append(done ? stickerEl(a, 240, 172, tile) : preview(a, 240, 172, true));
    const bd = done && badge(a); if (bd) tile.append(bd);
    const label = document.createElement('div'); label.textContent = a.name; tile.append(label);
    if (!done) { const p = document.createElement('small'); p.className = 'prog'; p.textContent = achProgress(a); tile.append(p); }
    tile.onclick = () => { bookSel = a; renderBook(); };
    grid.append(tile);
  }
  const det = $('bookDetail');
  if (!bookSel || !ACH.includes(bookSel)) { det.classList.add('hidden'); return; }
  det.classList.remove('hidden'); det.innerHTML = '';
  const a = bookSel, done = !!state.ach[a.id];
  det.append(done ? stickerEl(a, 480, 300) : preview(a, 480, 300, true));
  const box = document.createElement('div'), bd = badge(a);
  const when = done ? 'Earned ' + new Date(state.ach[a.id]).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : 'Locked · ' + achProgress(a);
  box.innerHTML = `${bd ? bd.outerHTML : ''}<h3>${a.name}</h3><div class="zone">${when}</div><p>${a.desc}</p>`;
  det.append(box);
}
document.querySelectorAll('#bookTabs button').forEach(b => b.onclick = () => {
  bookTab = b.dataset.tab; bookSel = null; document.querySelectorAll('#bookTabs button').forEach(x => x.classList.toggle('on', x === b)); renderBook();
});
$('bookBtn').onclick = () => { const bk = $('book'); bk.classList.toggle('hidden'); if (!bk.classList.contains('hidden')) { $('shop').classList.add('hidden'); renderBook(); } wake(); };
$('bookClose').onclick = () => { $('book').classList.add('hidden'); wake(); };

/* ----- info card & toast (both windows) ----- */
let cardT, toastT;
function zoneName(sp) {
  const m = (sp.zone[0] + sp.zone[1]) / 2;
  return m < .33 ? 'Sunlight zone · 0–200 meters' : m < .62 ? 'Twilight zone · 200–1,000 meters' : 'Midnight zone · deeper than 1,000 meters';
}
function showInfo(title, sub, text, releaseId) {
  $('cName').textContent = title; $('cZone').textContent = sub; $('cFact').textContent = text; $('cAct').innerHTML = '';
  if (releaseId) $('cAct').append(confirmBtn('Release back to the sea', () => {
    if (IS_VIEW) window.opener && window.opener.postMessage({ type: 'release', id: releaseId }, '*');
    else releaseById(releaseId);
    $('card').classList.remove('show');
  }));
  $('card').classList.add('show'); clearTimeout(cardT);
  cardT = setTimeout(() => $('card').classList.remove('show'), 8000);
}
function speciesCard(sp, o) { return [sp.name, sp.legend || sp.pass ? sp.origin : zoneName(sp), sp.fact, o && !sp.pass ? o.id : 0]; }
function showSpecies(sp, o) { showInfo(...speciesCard(sp, o)); }
// Two-tap button so a child can't release a creature by accident.
function confirmBtn(label, fn, cls = 'rel') {
  const b = document.createElement('button'); b.className = cls; b.textContent = label;
  let armed = false, tm;
  b.onclick = e => {
    e.stopPropagation();
    if (!armed) { armed = true; b.textContent = 'Tap again to confirm'; tm = setTimeout(() => { armed = false; b.textContent = label; }, 3000); return; }
    clearTimeout(tm); armed = false; b.textContent = label; fn();
  };
  return b;
}
function toast(s, fromMain) {
  $('toast').textContent = s; $('toast').classList.add('show'); clearTimeout(toastT);
  toastT = setTimeout(() => $('toast').classList.remove('show'), 5000);
  if (!IS_VIEW && !fromMain) post({ type: 'toast', s });
}

/* ----- taps & drags (world coordinates) ----- */
// Returns the card to show, or feeds the fish when the tap lands on open water.
function tapAt(wx, wy, fromView) {
  let card = null;
  for (let i = creatures.length - 1; i >= 0 && !card; i--) {
    const o = creatures[i];
    if (!o.leaving && hitCreature(o, wx, wy)) {
      card = speciesCard(o.sp, o);
      if (!S.tapped.includes(o.sp.id)) S.tapped.push(o.sp.id);
      if (o.sp.id === 'puffer') { o.puffT = 2.5; S.puffs++; }
    }
  }
  if (!card) for (const p of decorSpots()) if (inBox(p.d, (wx - p.x) / p.s, (wy - p.y) / p.s)) { card = [p.d.name, 'Decoration', p.d.desc, 0]; break; }
  if (!card && hitPass(wx, wy)) card = pass.tease
    ? ['???', 'Mystery animal', `Something very big lives in the sea... Collect ${fmt(price(pass.sp))} pearls to meet it.`, 0]
    : speciesCard(pass.sp);
  if (card) { if (fromView) post({ type: 'card', card }); else showInfo(...card); return; }
  if (wy < H * .6) S.feeds++;
  if (wy < H * .6) for (let i = 0; i < 4 && pellets.length < 60; i++) pellets.push({ x: wx + rand(-2, 2) * u, y: wy + rand(-1, 1) * u, ph: rand(0, 9) });
}
function viewToWorld(x, y) { return [camX + slot * W + x / vs, y / vs]; }
let down = null;
cv.addEventListener('pointerdown', e => {
  if (!IS_VIEW && wantFS !== 'none' && !document.fullscreenElement) goFullscreen();
  down ={ x: e.clientX, y: e.clientY, lx: e.clientX, moved: false }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (!down) return;
  if (!down.moved && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 10) down.moved = true;
  if (down.moved) {
    const dx = -(e.clientX - down.lx) / vs; down.lx = e.clientX;
    if (IS_VIEW) window.opener && window.opener.postMessage({ type: 'drag', dx }, '*'); else panBy(dx);
  }
});
cv.addEventListener('pointerup', e => {
  if (!down) return;
  const wasTap = !down.moved; down = null;
  if (!wasTap) return;
  const [wx, wy] = viewToWorld(e.clientX, e.clientY);
  if (IS_VIEW) window.opener && window.opener.postMessage({ type: 'tap', wx, wy }, '*'); else tapAt(wx, wy, false);
});
cv.addEventListener('pointercancel', () => { down = null; });

/* ----- idle, fullscreen, keys ----- */
let idleT;
function wake() {
  document.body.classList.remove('idle'); clearTimeout(idleT);
  const panelOpen = ['shop', 'book', 'parentMenu'].some(id => !$(id).classList.contains('hidden'));
  document.body.classList.toggle('panel-open', panelOpen);
  document.body.classList.toggle('book-open', !$('book').classList.contains('hidden'));
  idleT = setTimeout(() => document.body.classList.add('idle'), panelOpen ? 60000 : 5000);
}
['mousemove', 'pointerdown', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, wake, { passive: true }));
let wakeLock = null;
async function keepAwake() { try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); } } catch (e) {} }
// Fullscreen is switched on and off from the parent menu only. If a child knocks it out by accident,
// the next tap on the tank puts it back. Esc is locked while fullscreen, so leaving needs Esc held down,
// and a long Esc press counts as a grown-up leaving on purpose.
let wantFS = 'none', escDownAt = 0;
addEventListener('keydown', e => { if (e.key === 'Escape' && !e.repeat) escDownAt = performance.now(); });
addEventListener('keyup', e => { if (e.key === 'Escape') escDownAt = 0; });
const heldEsc = () => escDownAt && performance.now() - escDownAt > 800;
function lockEsc() { try { navigator.keyboard.lock(['Escape']).catch(() => {}); } catch (e) {} }
function goFullscreen() {
  const opts = wantFS === 'dual' && screenDetails ? { screen: screenDetails.currentScreen } : undefined;
  return document.documentElement.requestFullscreen(opts).then(lockEsc).catch(() => {});
}
function enterSingle() { wantFS = 'single'; goFullscreen(); keepAwake(); closeParent(); }
function exitAll() { wantFS = 'none'; if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); endDual(); closeParent(); }

let holdT, parentT;
function openParent() {
  $('parentMenu').classList.remove('hidden');
  prepareDual();
  $('exitBtn').classList.toggle('hidden', wantFS === 'none' && !document.fullscreenElement);
  clearTimeout(parentT); parentT = setTimeout(closeParent, 15000); wake();
}
function closeParent() { $('parentMenu').classList.add('hidden'); }
function setupGear() {
  const g = $('gear');
  g.addEventListener('pointerdown', e => {
    e.preventDefault(); g.classList.add('holding');
    holdT = setTimeout(() => { g.classList.remove('holding'); openParent(); }, 2000);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => g.addEventListener(ev, () => { clearTimeout(holdT); g.classList.remove('holding'); }));
  g.addEventListener('contextmenu', e => e.preventDefault());
}
addEventListener('pointerdown', keepAwake, { once: true });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); else save(); });
addEventListener('resize', resize);

/* ================= start ================= */
function startMain() {
  $('fsBtn').onclick = enterSingle;
  $('dualBtn').onclick = startDual;
  $('exitBtn').onclick = exitAll;
  setupGear();
  $('shopBtn').onclick = () => { const sh = $('shop'); sh.classList.toggle('hidden'); if (!sh.classList.contains('hidden')) $('book').classList.add('hidden'); updateHud(); wake(); };
  addEventListener('keydown', e => {
    if ((e.key === 'f' || e.key === 'F') && !document.fullscreenElement) enterSingle();
    if (e.key === 's' || e.key === 'S') $('shopBtn').click();
    if (e.key === 'b' || e.key === 'B') $('bookBtn').click();
    if (e.key === 'ArrowLeft') panBy(-W * .25);
    if (e.key === 'ArrowRight') panBy(W * .25);
  });
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && heldEsc()) exitAll(); });
  addEventListener('message', e => { if (companion && e.source === companion && e.data && e.data.type) onViewMessage(e.data); });
  addEventListener('beforeunload', () => { save(); endDual(); });
  setInterval(save, 5000);

  resize(); populate();
  camX = maxCam() / 2; syncPhase();
  const away = (Date.now() - (state.lastSeen || Date.now())) / 1000;
  if (away > 60) {
    const got = income() * Math.min(away, 12 * 3600) * .5;
    addPearls(got);
    setTimeout(() => toast('While the tank was closed, your animals collected ' + fmt(got) + ' pearls'), 600);
  } else setTimeout(() => toast('Tap the water to feed the fish, drag to look around, and open the Shop to buy new animals'), 600);
  passTimer = PASSERS.some(has) ? 30 : 90;
  countDay(); checkAch(true);
  prepareDual();
  wake();
  requestAnimationFrame(frame);
}

// Second screen: draw whatever the main window last sent; keep bubbles and snow moving locally.
let snap = null, viewLast = performance.now();
function applySnap(m) {
  if (m.W !== W || m.H !== H) { setWorld(m.W, m.H); vs = VH / H; }
  T = m.T; camX = m.camX; span = m.span; slot = m.slot; state.decor = m.decor; chest.open = m.chestOpen;
  creatures = m.cr.map(a => ({ sp: SP[a[0]], x: a[1], y: a[2], t: a[3], fs: a[4], face: a[5], puff: a[6], k: a[7], vx: a[8], vy: a[9], id: a[10], leaving: !!a[11], z: a[12] }));
  pellets = m.pel.map(p => ({ x: p[0], y: p[1] }));
  pass = m.pass ? Object.assign({}, m.pass, { sp: SP[m.pass.i] }) : null;
  texts = m.texts; sparks = m.sparks;
  snap = m;
}
function viewFrame(now) {
  const dt = Math.min(.05, Math.max(0, (now - viewLast) / 1000)); viewLast = now;
  if (!window.opener || window.opener.closed) { window.close(); return; }
  if (snap) { updCosmetics(dt, T); render(T, camX + slot * W, slot === span - 1); }
  requestAnimationFrame(viewFrame);
}
function startView() {
  document.body.classList.add('view');
  $('viewTap').classList.remove('hidden');
  addEventListener('message', e => {
    if (e.source !== window.opener || !e.data) return;
    const m = e.data;
    if (m.type === 'snap') applySnap(m);
    else if (m.type === 'card') showInfo(...m.card);
    else if (m.type === 'toast') toast(m.s, true);
  });
  addEventListener('pointerdown', () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().then(() => $('viewTap').classList.add('hidden')).catch(() => {});
  });
  document.addEventListener('fullscreenchange', () => {
    if (document.fullscreenElement) { $('viewTap').classList.add('hidden'); lockEsc(); }
    else if (heldEsc()) window.opener && window.opener.postMessage({ type: 'exit' }, '*');
  });
  resize();
  requestAnimationFrame(viewFrame);
}
if (IS_VIEW) startView(); else startMain();
// Installed as an app on a phone: keep working offline. Only possible when served over http(s).
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
